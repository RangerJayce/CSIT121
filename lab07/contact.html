<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link rel="stylesheet" href="style.css">

<body>

    <nav>
        <ul>
            <li><a href="tierlist.html">Back</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Contact Us & Give Feedback</h1>

        <form action="#" method="POST">
            
            <fieldset>
                <legend>Your Information</legend>
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="text">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email">
                </div>

            </fieldset>

            <fieldset>
                <legend>Reason For Contacting</legend>

                    <label for="reason">Agreement or Complaint?</label>
                    <select id="reason" name="reason">
                        <option value="Agreement">Agreement</option>
                        <option value="complaint">Complaint</option>
                    </select>
                </div>

                <div class="form-group">
                    <span class="label-text">Are you a Pitsburgh Penguins fan?</span>
                    <label class="radio-label">
                        <input type="radio" name="vscode_stier" value="yes"> Yes
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="vscode_stier" value="no"> No
                    </label>
                </div>

                <div class="form-group">
                    <span class="label-text">Please enter your feedback</span>
                    <div class="checkbox-group">
                        <input type="text" id="feedback" name="feedback" placeholder="feedback">
                    </div>
                </div>

                <div class="form-group">
                    <label for="comments">Comment</label>
                    <textarea id="comments" name="comments" rows="4"></textarea>
                </div>
            </fieldset>

            <button type="submit" class="submit-btn">Submit Feedback</button>

        </form>
    </main>

</body>
</html>
